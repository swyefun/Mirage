name: CI

on:
  push:
    branches: [main, cross-platform]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # qemu-system-arm.exe with its MinGW DLLs and keymaps
  qemu-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out qemu-miwear
        shell: pwsh
        run: git submodule update --init --depth 1 External/qemu-miwear
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git diffutils
          pacboy: >-
            gcc:p glib2:p pixman:p python:p meson:p ninja:p pkgconf:p
      - name: Build QEMU
        run: Scripts/build-qemu-windows.sh "$GITHUB_WORKSPACE/.build/windows/qemu"
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-windows
          path: .build/windows/qemu

  windows:
    runs-on: windows-latest
    needs: qemu-windows
    defaults:
      run:
        # bash is not supported by gha-setup-swift on Windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out the AstroBox modules
        run: git submodule update --init --depth 1 External/AstroBox/modules/core External/AstroBox/modules/bluetooth External/AstroBox/modules/frontbridge External/AstroBox/modules/pb External/AstroBox/modules/vivo_msgpack External/AstroBox/plugins/btclassic-spp
      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5
      - name: Setup Swift
        uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.3-release
          tag: 6.3-RELEASE
      - name: Swift version
        run: swift --version
      - name: Assemble AstroBox-NG worktree for the companion core
        run: |
          # AstroBoxBridge/Cargo.toml resolves path deps against
          # ../../AstroBox-NG/src-tauri/{modules,plugins}. Upstream CI only
          # checks out standalone modules under External/AstroBox, so mirror
          # them into the layout the bridge expects.
          $root = Join-Path (Resolve-Path ..).Path 'AstroBox-NG'
          $mods = Join-Path $root 'src-tauri/modules'
          $plugs = Join-Path $root 'src-tauri/plugins'
          New-Item -ItemType Directory -Force -Path $mods | Out-Null
          New-Item -ItemType Directory -Force -Path $plugs | Out-Null
          foreach ($name in @('core','bluetooth','frontbridge','pb','vivo_msgpack')) {
            $src = Join-Path (Resolve-Path .).Path "External/AstroBox/modules/$name"
            Copy-Item -Recurse -Force $src (Join-Path $mods $name)
          }
          Copy-Item -Recurse -Force (Join-Path (Resolve-Path .).Path 'External/AstroBox/plugins/btclassic-spp') (Join-Path $plugs 'btclassic-spp')
          # frontbridge declares tauri-runtime-cef as a cfg(target_os="linux")
          # path dependency; Cargo still resolves it on Windows even though it
          # is never compiled. The real crate is private, so drop a minimal
          # placeholder that only satisfies path resolution.
          $vendor = Join-Path (Join-Path $root 'src-tauri') 'vendor/tauri-runtime-cef'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          @("[package]", "name = `"tauri-runtime-cef`"", "version = `"0.1.0`"", "edition = `"2021`"", "", "[lib]", "path = `"src/lib.rs`"") | Set-Content (Join-Path $vendor 'Cargo.toml')
          New-Item -ItemType Directory -Force -Path (Join-Path $vendor 'src') | Out-Null
          Set-Content (Join-Path $vendor 'src/lib.rs') ''
          Get-ChildItem $mods | Select-Object Name
      - name: Companion core
        run: Scripts/build-companion-core.ps1
      - name: MirageKit tests
        run: swift test --package-path Packages/MirageKit
      - name: Build Mirage
        run: Scripts/build-windows.ps1 -c release
      - uses: actions/download-artifact@v4
        with:
          name: qemu-windows
          path: dist/Mirage/qemu
      - name: Package
        run: |
          $dist = "dist/Mirage"
          $bin = swift build -c release --show-bin-path
          Copy-Item "$bin/Mirage.exe" "$dist/"
          Get-ChildItem $bin -Directory -Filter '*.resources' | Copy-Item -Destination $dist -Recurse
          # Swift runtime (swiftCore, Foundation, dispatch, ...) next to the exe
          $runtime = Split-Path (Get-Command swiftCore.dll -ErrorAction SilentlyContinue).Source
          if (-not $runtime) {
            $runtime = Get-ChildItem "$env:LOCALAPPDATA/Programs/Swift/Runtimes" -Recurse -Filter swiftCore.dll | Select-Object -First 1 | Split-Path
          }
          Copy-Item "$runtime/*.dll" $dist
          # WinUI needs the Windows App Runtime 1.5; the app installs it on first launch
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.5/1.5.250108004/windowsappruntimeinstall-x64.exe" -OutFile "$dist/WindowsAppRuntimeInstaller.exe"
          Get-ChildItem $dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Mirage-windows-x64
          path: dist

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.1"
      - name: MirageKit tests
        run: swift test --package-path Packages/MirageKit
      - name: Build Mirage (GTK)
        run: swift build --product Mirage

  # the shipped macOS app: native SwiftUI (Mirage.xcodeproj), QEMU bundled
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out the submodules
        run: |
          git submodule update --init --depth 1 External/qemu-miwear External/AstroBox/modules/core External/AstroBox/modules/bluetooth External/AstroBox/modules/frontbridge External/AstroBox/modules/pb External/AstroBox/modules/vivo_msgpack External/AstroBox/plugins/btclassic-spp
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: QEMU dependencies
        run: brew install glib pixman meson ninja pkgconf
      - name: Build QEMU
        run: Scripts/build-qemu.sh
      - name: MirageKit tests
        run: swift test --package-path Packages/MirageKit
      - name: Build Mirage.app
        run: |
          xcodebuild -project Mirage.xcodeproj -scheme Mirage -configuration Release \
            -derivedDataPath .build/xcode -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent .build/xcode/Build/Products/Release/Mirage.app dist/Mirage-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mirage-macOS
          path: dist/Mirage-macOS.zip
